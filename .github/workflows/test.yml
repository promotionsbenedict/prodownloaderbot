name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration_test
          POSTGRES_DB: prodownloader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration_test@127.0.0.1/prodownloader_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      BOT_TOKEN: 123456:ci-only-invalid-token
      POSTGRES_PASSWORD: compose_test_only
      DENY_NETWORKS: 192.0.2.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt -r requirements-extractor.txt pytest==9.2.0
      - run: python -m pytest -q
      - run: docker compose config --quiet && docker compose -f compose.yaml -f compose.links.yaml config --quiet
      - run: chmod -R go-rwx prodownloader migrations
      - run: docker compose up -d --build --wait --wait-timeout 150 api extractor
      - run: |
          docker compose exec -T extractor python - <<'PYTEST'
          import prodownloader.adapters
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              with playwright.chromium.launch() as browser:
                  page = browser.new_page()
                  page.set_content("<video src='https://example.com/sample.mp4'></video>")
                  assert page.locator("video").get_attribute("src").endswith("sample.mp4")
          PYTEST
      - if: always()
        run: docker compose ps -a && docker compose logs --tail=50
